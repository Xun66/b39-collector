# 开发板：ESP32-S3，双USB接口型号
# === 注意 ===
# 部分开发板需要短接USB-OTG端子才能给空气检测仪供电
# 提前确认自己可以焊接，或者联系商家代焊！

esphome:
  name: b39-air-monitor
  friendly_name: B39 Air Monitor
  min_version: 2025.8.0
  name_add_mac_suffix: false
  project:
    name: xun66.b39-air-monitor
    version: dev

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ## 当无法自动发现设备，可以指定IP要搜索的地址
  # use_address: 192.168.12.148 

  ## 当需要固定IP地址又不想配置DHCP绑定，可以直接指定静态IP地址
  # manual_ip:
  #   static_ip: 192.168.12.148
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0

api:
  # 建议开启加密，增加安全性，相应的key生成过程见README
  # encryption:
  #   key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

captive_portal:

usb_host:
  max_transfer_requests: 32

usb_uart:
  - type: cdc_acm
    vid: 0x303A
    pid: 0x1001
    channels:
      - id: b39_uart
        baud_rate: 115200
        buffer_size: 2048

interval:
  - interval: 250ms
    then:
      - lambda: |-
          static std::string line;

          auto publish_b39_line = [](const std::string &raw_line) {
            std::vector<float> values;
            std::string token;

            for (char c : raw_line) {
              if (c == ',') {
                values.push_back(std::atof(token.c_str()));
                token.clear();
              } else {
                token.push_back(c);
              }
            }
            values.push_back(std::atof(token.c_str()));

            if (values.size() != 8) {
              ESP_LOGW("b39", "Invalid field count: %u", static_cast<unsigned>(values.size()));
              return;
            }

            id(b39_particle).publish_state(values[0]);
            id(b39_pm25).publish_state(values[1]);
            id(b39_hcho).publish_state(values[2]);
            id(b39_co2).publish_state(values[3]);
            id(b39_temperature).publish_state(values[4]);
            id(b39_humidity).publish_state(values[5]);
            id(b39_tvoc).publish_state(values[6]);
            id(b39_sequence).publish_state(values[7]);
          };

          uint8_t byte;
          while (id(b39_uart)->available()) {
            if (!id(b39_uart)->read_byte(&byte)) {
              break;
            }

            if (byte == '\r') {
              continue;
            }

            if (byte != '\n') {
              if (line.size() < 256) {
                line.push_back(static_cast<char>(byte));
              } else {
                ESP_LOGW("b39", "Line buffer overflow, dropping partial frame");
                line.clear();
              }
              continue;
            }

            ESP_LOGD("b39", "RX: %s", line.c_str());
            publish_b39_line(line);
            line.clear();
          }

  - interval: 1s
    then:
      - if:
          condition:
            binary_sensor.is_on: api_status
          then:
            - light.turn_on:
                id: status_rgb
                red: 0%
                green: 40%
                blue: 0%
                brightness: 20%
                transition_length: 0s
          else:
            - light.turn_on:
                id: status_rgb
                red: 40%
                green: 0%
                blue: 0%
                brightness: 20%
                transition_length: 0s
      - delay: 20ms
      - light.turn_off: 
          id: status_rgb
          transition_length: 0s

button:
  - platform: safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    name: Factory Reset

sensor:
  - platform: template
    id: b39_hcho
    name: Formaldehyde
    unit_of_measurement: "ug/m³"
    accuracy_decimals: 0
    state_class: measurement
    device_class: volatile_organic_compounds

  - platform: template
    id: b39_tvoc
    name: TVOC
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    state_class: measurement
    device_class: volatile_organic_compounds

  - platform: template
    id: b39_temperature
    name: Temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    state_class: measurement
    device_class: temperature

  - platform: template
    id: b39_humidity
    name: Humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity

  - platform: template
    id: b39_particle
    name: Particle Count
    unit_of_measurement: "pcs/0.1L"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    id: b39_pm25
    name: PM2.5
    unit_of_measurement: "ug/m³"
    accuracy_decimals: 0
    state_class: measurement
    device_class: pm25

  - platform: template
    id: b39_co2
    name: CO2
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    state_class: measurement
    device_class: carbon_dioxide

  - platform: template
    id: b39_sequence
    name: Sequence
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal dB
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: WiFi Signal Percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: Status RGB
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  - platform: status
    id: api_status
    name: Status
